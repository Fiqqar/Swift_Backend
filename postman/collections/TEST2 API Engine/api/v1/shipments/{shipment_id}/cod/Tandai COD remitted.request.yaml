$kind: http-request
description: |-
  Menandai COD shipment sebagai `remitted` (dana sudah disetor). Membutuhkan status COD `collected` sebelumnya (otomatis saat shipment delivered).

  - **Path wajib:** `shipment_id`.
  - **Body wajib:** `status` = `remitted`.
  - Error `404` tidak ditemukan, `409` bila COD belum collected.
url: "{{baseUrl}}/api/v1/shipments/:shipment_id/cod"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  shipment_id: "431"
body:
  type: json
  content: |-
    {
      "status": "string"
    }
settings: {}
examples: ./.resources/Tandai COD remitted.resources/examples
order: 1000
