$kind: http-request
description: |-
  Tambah event history.

  - **Path wajib:** `shipment_id`.
  - **Body wajib:** `event`.
url: '{{baseUrl}}/api/v1/shipments/:shipment_id/history'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  shipment_id: '1'
body:
  type: json
  content: |-
    {
      "event": "pod_submitted",
      "keterangan": "Paket diterima",
      "recipient_name": "Budi",
      "latitude": -6.81,
      "longitude": 110.85,
      "photo_urls": [
        "https://example.com/pod.jpg"
      ]
    }
settings: {}
examples: ./.resources/Tambah event history.resources/examples
order: 2000
