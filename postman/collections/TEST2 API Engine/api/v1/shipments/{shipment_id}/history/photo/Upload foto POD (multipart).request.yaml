$kind: http-request
description: |-
  Upload foto POD (multipart).

  - **Path wajib:** `shipment_id`.
  - **Form wajib:** `file`.
  - **Form opsional:** `recipient_name`, `latitude`, `longitude`, `keterangan`.
url: '{{baseUrl}}/api/v1/shipments/:shipment_id/history/photo'
method: POST
headers:
  Accept: application/json
pathVariables:
  shipment_id: '1'
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
    - key: recipient_name
      type: text
      value: Budi
    - key: latitude
      type: text
      value: '-6.81'
    - key: longitude
      type: text
      value: '110.85'
    - key: keterangan
      type: text
      value: Paket diterima
settings: {}
examples: ./.resources/Upload foto POD (multipart).resources/examples
order: 1000
