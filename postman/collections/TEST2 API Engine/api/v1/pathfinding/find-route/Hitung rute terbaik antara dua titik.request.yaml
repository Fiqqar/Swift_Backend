$kind: http-request
description: |-
  Menghitung rute optimal (distance + ETA) dari `origin` ke `destination`.

  - **Wajib:** `origin`, `destination` (Coordinate).
  - **Opsional:** `mode` (motorcycle/car/truck), `last_mile_precision`, `dynamic_rerouting`.

  Error: `400` di luar jangkauan peta, `404` rute tidak ditemukan, `500` gagal memuat peta.
url: "{{baseUrl}}/api/v1/pathfinding/find-route"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "origin": {
        "latitude": -40.30287583682011,
        "longitude": -141.16844062209313
      },
      "destination": {
        "latitude": 53.23959444060915,
        "longitude": 11.656593606103058
      },
      "mode": "car",
      "last_mile_precision": null,
      "dynamic_rerouting": null
    }
settings: {}
examples: ./.resources/Hitung rute terbaik antara dua titik.resources/examples
order: 1000
