$kind: http-request
description: |-
  Menghitung rute terbaik antara dua titik.

  - **Wajib:** `origin`, `destination`.
  - **Opsional:** `mode`, `last_mile_precision`.

  Error `400` di luar jangkauan peta, `404` rute tidak ditemukan, `500` gagal memuat peta.
url: '{{baseUrl}}/api/v1/pathfinding/find-route'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "origin": {
        "latitude": -6.8048,
        "longitude": 110.8385
      },
      "destination": {
        "latitude": -6.81,
        "longitude": 110.85
      },
      "mode": "motorcycle",
      "last_mile_precision": true
    }
settings: {}
examples: ./.resources/Hitung rute terbaik antara dua titik.resources/examples
order: 1000
