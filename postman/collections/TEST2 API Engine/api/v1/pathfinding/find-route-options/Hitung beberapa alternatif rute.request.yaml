$kind: http-request
description: |-
  Menghitung beberapa alternatif rute antara dua titik.

  - **Wajib:** `origin`, `destination`.
  - **Opsional:** `mode`, `last_mile_precision`.

  Jumlah alternatif dikontrol env `ALTERNATIVE_ROUTES_MAX`.
url: '{{baseUrl}}/api/v1/pathfinding/find-route-options'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "origin": {
        "latitude": -6.8048,
        "longitude": 110.8385
      },
      "destination": {
        "latitude": -6.81,
        "longitude": 110.85
      },
      "mode": "motorcycle",
      "last_mile_precision": true
    }
settings: {}
examples: ./.resources/Hitung beberapa alternatif rute.resources/examples
order: 1000
