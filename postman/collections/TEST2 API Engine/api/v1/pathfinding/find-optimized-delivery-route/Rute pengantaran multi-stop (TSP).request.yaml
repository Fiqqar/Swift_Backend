$kind: http-request
name: Rute pengantaran multi-stop (TSP)
description: |-
  Rute pengantaran multi-stop (TSP).

  - **Wajib:** minimal satu item pada `deliveries`.
  - **Titik awal:** gunakan `courier_position` atau `hub_origin`.
  - **Opsional:** `mode`, `last_mile_precision`, `skip_traffic`, `return_to_hub`.
url: "{{baseUrl}}/api/v1/pathfinding/find-optimized-delivery-route"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
    //   "hub_origin": {
    //     "latitude": -6.8048,
    //     "longitude": 110.8385
    //   },
    //   "courier_position": {
    //     "latitude": -6.805,
    //     "longitude": 110.839
    //   },
      "deliveries": [
        {
          "package_id": 1,
          "recipient_name": "Budi",
          "service_type": "EXPRESS",
          "alamat": "Jl. Kudus No. 1, Kota Kudus",
          "latitude": -6.81,
          "longitude": 110.85
        },
        {
          "package_id": 2,
          "recipient_name": "Siti",
          "service_type": "REGULAR",
          "alamat": "Jl. Besito, Gebog, Kabupaten Kudus"
        }
      ],
      "mode": "motorcycle",
      "last_mile_precision": true,
      "skip_traffic": false,
      "return_to_hub": true
    }
settings: {}
examples: ./.resources/Rute pengantaran multi-stop (TSP).resources/examples
