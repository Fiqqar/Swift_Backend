$kind: http-request
description: |-
  Cek geofence posisi terhadap target stop.

  - **Wajib:** `current`, `target`.
  - **Opsional:** `radius_m`.

  Untuk deteksi real-time gunakan WebSocket `WS /api/v1/ws/driver/position`.
url: '{{baseUrl}}/api/v1/pathfinding/geofence-check'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "current": {
        "latitude": -6.8048,
        "longitude": 110.8385
      },
      "target": {
        "latitude": -6.81,
        "longitude": 110.85
      },
      "radius_m": 30
    }
settings: {}
examples: ./.resources/Cek geofence posisi vs target stop.resources/examples
order: 1000
