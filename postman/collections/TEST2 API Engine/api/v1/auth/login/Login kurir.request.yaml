$kind: http-request
name: Login kurir
description: |-
  Login kurir.

  - **Wajib:** `username`, `password`.
  - Mengembalikan token JWT untuk endpoint yang membutuhkan autentikasi.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "joko",
      "password": "rahasia123"
    }
scripts:
  - type: afterResponse
    code: "const responseJson = pm.response.json();\r

      const accessToken = responseJson.data.token;\r

      pm.environment.set(\"bearerToken\", accessToken);"
    language: text/javascript
settings: {}
examples: ./.resources/Login kurir.resources/examples
order: 1000
