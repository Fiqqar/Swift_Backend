  Set atau memperbarui penalti traffic sebuah edge.

  - **Wajib:** `edge_id`, `multiplier` (>0).
  - Error `503` bila Redis tidak tersedia.
url: '{{baseUrl}}/api/v1/traffic/update-weight'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "edge_id": 12345,
      "multiplier": 1.5
    }
settings: {}
examples: ./.resources/Set-memperbarui penalti traffic sebuah edge.resources/examples
order: 1000
