$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/traffic/update-weight"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "edge_id": 419,
        "multiplier": 949.6635789262971
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "string",
        "edge_id": 7709,
        "multiplier": 507.1720005050717
      }
order: 1000
