$kind: http-request
description: |-
  Mengubah status batch dan meng-cascade ke semua shipment di dalamnya (menulis TrackingHistory).

  - **Path wajib:** `batch_id`.
  - **Body wajib:** `status` (`picked_up`/`delivered`/`returned`).
  - Transisi: `assigned → picked_up → delivered`, atau `returned` dari `assigned`/`picked_up`.
  - Error `404` batch tidak ditemukan, `409` transisi tidak valid.
url: "{{baseUrl}}/api/v1/batches/:batch_id/status"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  batch_id: "2605"
body:
  type: json
  content: |-
    {
      "status": "returned"
    }
settings: {}
examples: ./.resources/Update status batch.resources/examples
order: 1000
