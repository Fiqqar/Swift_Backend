$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/batches/:batch_id/status"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    batch_id: "2605"
  body:
    type: json
    content: |-
      {
        "status": "returned"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
