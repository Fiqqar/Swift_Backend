$kind: websocket-request
description: |-
  WebSocket real-time posisi kurir.

  - Handshake auth: query param `token={{bearerToken}}` atau header `Authorization: Bearer {{bearerToken}}`.
  - Guard: `ENABLE_LIVE_TRACKING` (bila False, koneksi ditolak kode 1008; auth gagal ditutup kode 4401).
  - Rate limit `KURIR_POS_MAX_RATE_SECONDS` per koneksi.

  Pesan masuk:
  - `{"type":"ping"}` untuk menerima `ack`.
  - `{"type":"position","lat":-6.8048,"lon":110.8385,"bearing":90,"speed":10}` untuk menyimpan posisi, snap best-effort, dan cek geofence.

  Pesan keluar:
  - `ack`, `error`, `geofence_enter`, `geofence_exit`.
url: 'ws://localhost:8000/api/v1/ws/driver/position?token={{bearerToken}}'
headers:
  - key: Authorization
    value: 'Bearer {{bearerToken}}'
settings: {}
order: 2000
