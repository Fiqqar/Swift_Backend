[project]
name = "test2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1,<0.142",
    "pydantic>=2.13.4",
    "osmnx>=1.9,<2",
    "orjson>=3.11.9",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.4",
    "redis>=8.1.0",
    "osmium>=4.3.1 ; python_full_version < '3.14'",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "cloudinary>=1.45.0",
    "google-genai>=1.14.0",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "_rust_engine"

[tool.uv]
package = false
